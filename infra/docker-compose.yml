# Infraestrutura local de desenvolvimento.
# Uso (na raiz): pnpm infra:up  |  pnpm infra:down
name: fiscalizapp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fiscalizapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiscalizapp}
      POSTGRES_DB: ${POSTGRES_DB:-fiscalizapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiscalizapp} -d ${POSTGRES_DB:-fiscalizapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Filas e agendamento dos coletores (BullMQ) + cache da API
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Armazenamento S3-compatível dos arquivos brutos coletados (proveniência).
  # Em produção: S3, Cloudflare R2 ou similar.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fiscalizapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fiscalizapp-dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria o bucket dos arquivos brutos na primeira subida
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fiscalizapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fiscalizapp-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-fontes-brutas}
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
